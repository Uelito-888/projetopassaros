<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Álbum dos Passarinhos</title>
<style>
  :root{
    --bg:#fbf6ea; --ink:#2b3a2e; --muted:#6b7a6e; --accent:#e4572e; --leaf:#3f7d58; --sky:#cfe8ef; --card:#ffffff;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:linear-gradient(180deg,var(--sky),var(--bg))}
  #login[hidden]{display:none}
  .login-card{background:var(--card);border-radius:var(--radius);padding:32px 28px;width:min(420px,100%);
    box-shadow:0 18px 50px rgba(43,58,46,.15);text-align:center}
  .login-card svg{width:84px;height:84px;margin-bottom:8px}
  .login-card h1{font-size:1.6rem;margin-bottom:4px}
  .login-card p{color:var(--muted);margin-bottom:20px;font-size:.95rem}
  label{display:block;text-align:left;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:13px 14px;border:2px solid #e3dcc8;border-radius:14px;font-size:1rem;background:#fffdf7;color:var(--ink)}
  input:focus{outline:none;border-color:var(--leaf)}
  button.primary{margin-top:20px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
  button.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
  button.primary:disabled{opacity:.6;cursor:wait}
  #loginMsg{margin-top:14px;min-height:1.3em;font-size:.9rem;color:#b3261e}

  /* ---------- Hero ---------- */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:60px 24px 80px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%,var(--sky),transparent 70%)}
  .hero h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1.05;margin:18px 0 12px;letter-spacing:-.02em}
  .hero h1 span{color:var(--accent)}
  .hero p{max-width:34ch;font-size:clamp(1.05rem,2.4vw,1.35rem);color:var(--muted)}
  .hero .bird{width:clamp(110px,20vw,190px);animation:float 4s ease-in-out infinite}
  .scroll-hint{margin-top:42px;font-size:.9rem;color:var(--muted);animation:bounce 1.8s infinite}
  @keyframes float{50%{transform:translateY(-14px) rotate(-3deg)}}
  @keyframes bounce{50%{transform:translateY(8px)}}
  .cloud{position:absolute;background:#fff;border-radius:99px;opacity:.8;filter:blur(1px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:140px;height:40px;top:14%;left:-160px;animation:drift 38s linear infinite}
  .c1::before{width:60px;height:60px;top:-30px;left:20px}.c1::after{width:46px;height:46px;top:-20px;left:70px}
  .c2{width:100px;height:30px;top:30%;left:-120px;animation:drift 52s linear infinite 8s}
  .c2::before{width:44px;height:44px;top:-22px;left:14px}.c2::after{width:34px;height:34px;top:-14px;left:50px}
  @keyframes drift{to{transform:translateX(calc(100vw + 320px))}}

  /* ---------- Faixas horizontais de fotos ---------- */
  #album{display:flex;flex-direction:column}
  .band{width:100%;padding:clamp(28px,6vw,64px) clamp(16px,5vw,64px);display:flex;justify-content:center}
  .band:nth-child(even){background:rgba(207,232,239,.35)}
  .band-inner{width:min(1200px,100%);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:center}
  .band:nth-child(even) .band-inner{grid-template-columns:minmax(0,1fr) minmax(0,3fr)}
  .band:nth-child(even) figure{order:2}
  .photo{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:0 14px 40px rgba(43,58,46,.2);
    aspect-ratio:16/9;background:#e9e1cb;cursor:zoom-in}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
  .photo:hover img{transform:scale(1.04)}
  .caption{font-size:clamp(1.2rem,3vw,2rem);font-weight:700;line-height:1.15}
  .caption small{display:block;font-size:.85rem;font-weight:400;color:var(--muted);margin-top:8px}
  .num{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--leaf);color:#fff;
    font-weight:700;margin-bottom:12px}

  /* surgir ao rolar */
  .reveal{opacity:0;transform:translateY(60px) scale(.97);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .reveal.delay{transition-delay:.18s}

  @media (max-width:720px){
    .band-inner,.band:nth-child(even) .band-inner{grid-template-columns:1fr}
    .band:nth-child(even) figure{order:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .reveal{opacity:1;transform:none}
  }

  /* ---------- Estados ---------- */
  .state{text-align:center;padding:60px 24px;color:var(--muted);font-size:1.1rem}
  footer{text-align:center;padding:48px 20px 64px;color:var(--muted);font-size:.95rem}
  footer button{margin-top:14px;background:none;border:2px solid #d8d0b8;color:var(--muted);padding:8px 18px;border-radius:99px;cursor:pointer;font-size:.9rem}
  footer button:hover{border-color:var(--leaf);color:var(--leaf)}

  /* ---------- Lightbox ---------- */
  #lightbox{position:fixed;inset:0;z-index:60;background:rgba(15,22,17,.92);display:none;place-items:center;padding:20px;cursor:zoom-out}
  #lightbox.open{display:grid}
  #lightbox img{max-width:100%;max-height:88vh;border-radius:12px}
  #lightbox p{color:#fff;text-align:center;margin-top:12px;font-size:1.1rem}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="login-card" id="loginForm">
    <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#bird"/></svg>
    <h1>Álbum dos Passarinhos</h1>
    <p>Entre com o e-mail e a senha que a escola enviou.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="primary" id="btnEntrar" type="submit">Entrar</button>
    <div id="loginMsg" role="alert"></div>
  </form>
</section>

<!-- CONTEÚDO -->
<main id="app" hidden>
  <header class="hero">
    <div class="cloud c1"></div><div class="cloud c2"></div>
    <svg class="bird" viewBox="0 0 100 100" aria-hidden="true"><use href="#bird"/></svg>
    <h1>Nossos <span>Passarinhos</span></h1>
    <p>Um álbum feito com muito carinho pelas crianças da nossa sala.</p>
    <div class="scroll-hint">role para baixo ↓</div>
  </header>

  <section id="album" aria-live="polite"></section>

  <footer>
    <div>Feito com carinho pela turma 🐦</div>
    <button id="btnSair" type="button">Sair</button>
  </footer>
</main>

<div id="lightbox" role="dialog" aria-modal="true"><div><img alt=""><p></p></div></div>

<!-- Passarinho (SVG reutilizável) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bird" viewBox="0 0 100 100">
    <ellipse cx="50" cy="58" rx="30" ry="25" fill="#e4572e"/>
    <circle cx="68" cy="38" r="16" fill="#e4572e"/>
    <path d="M82 36 L98 41 L82 46 Z" fill="#f4b942"/>
    <circle cx="72" cy="35" r="3.2" fill="#2b3a2e"/>
    <circle cx="73" cy="34" r="1" fill="#fff"/>
    <path d="M22 52 L2 38 L8 62 L24 66 Z" fill="#3f7d58"/>
    <path d="M38 55 Q52 40 64 62 Q50 74 38 55 Z" fill="#c8431f"/>
    <path d="M44 82 L44 92 M56 82 L56 92" stroke="#f4b942" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO — preencha com os dados do seu projeto Supabase
   (Project Settings → API). Use a chave "anon / public".
   NUNCA coloque a chave "service_role" aqui.
   ========================================================= */
const SUPABASE_URL      = "https://onvsyopaxskqpvdcctcp.supabase.co";   // ex: https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_C7D_EQn_oKNm2Vnbh6RAXQ_fe2LRtA5";
const BUCKET            = "album";                         // nome do bucket (privado)
const SIGNED_URL_SECS   = 3600;                            // validade dos links das fotos

const $ = (id) => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- Acesso direto pelo QR code ----------
   O QR aponta para  https://seusite/#a=EMAIL&k=SENHA
   (o "#" nunca é enviado ao servidor). A página entra sozinha
   com a conta das famílias e apaga o trecho da barra de endereço. */
async function loginPeloQR() {
  if (!location.hash || location.hash.length < 3) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  const email = p.get("a"), senha = p.get("k");
  if (!email || !senha) return false;
  history.replaceState(null, "", location.pathname + location.search);
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  return !error;
}

/* ---------- Login manual ---------- */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("btnEntrar"), msg = $("loginMsg");
  btn.disabled = true; msg.textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("senha").value
  });
  btn.disabled = false;
  if (error) { msg.textContent = "E-mail ou senha incorretos. Tente novamente."; return; }
  await mostrarAlbum();
});

$("btnSair").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

/* ---------- Álbum ---------- */
function legenda(nomeArquivo) {
  // "03-bem-te-vi.jpg" → "Bem te vi"
  let t = nomeArquivo.replace(/\.[^.]+$/, "").replace(/^\d+[\s._-]*/, "").replace(/[_-]+/g, " ").trim();
  if (!t) t = "Passarinho";
  return t.charAt(0).toUpperCase() + t.slice(1);
}

async function mostrarAlbum() {
  $("login").hidden = true;
  $("app").hidden = false;
  const area = $("album");
  area.innerHTML = '<div class="state">Carregando as fotos… 🐦</div>';

  const { data: arquivos, error } = await sb.storage.from(BUCKET)
    .list("", { limit: 500, sortBy: { column: "name", order: "asc" } });

  if (error) { area.innerHTML = '<div class="state">Não foi possível carregar o álbum agora. Tente novamente em instantes.</div>'; return; }

  const imagens = (arquivos || []).filter(f => f.id && /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name));
  if (!imagens.length) { area.innerHTML = '<div class="state">Em breve as fotos aparecerão aqui! 🌱</div>'; return; }

  const { data: urls, error: e2 } = await sb.storage.from(BUCKET)
    .createSignedUrls(imagens.map(f => f.name), SIGNED_URL_SECS);
  if (e2) { area.innerHTML = '<div class="state">Não foi possível carregar as fotos agora.</div>'; return; }

  area.innerHTML = "";
  urls.forEach((u, i) => {
    if (!u.signedUrl) return;
    const nome = imagens.find(f => f.name === u.path)?.name || u.path;
    const band = document.createElement("div");
    band.className = "band";
    band.innerHTML = `
      <div class="band-inner">
        <figure class="reveal"><div class="photo"><img loading="lazy" alt=""></div></figure>
        <div class="reveal delay">
          <div class="num"></div>
          <div class="caption"></div>
        </div>
      </div>`;
    const img = band.querySelector("img");
    img.src = u.signedUrl;
    img.alt = legenda(nome);
    band.querySelector(".num").textContent = i + 1;
    band.querySelector(".caption").textContent = legenda(nome);
    band.querySelector(".photo").addEventListener("click", () => abrirLightbox(u.signedUrl, legenda(nome)));
    area.appendChild(band);
  });
  observarReveal();
}

/* ---------- Animação ao rolar ---------- */
function observarReveal() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.18, rootMargin: "0px 0px -6% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}

/* ---------- Lightbox ---------- */
const lb = $("lightbox");
function abrirLightbox(src, texto) {
  lb.querySelector("img").src = src;
  lb.querySelector("p").textContent = texto;
  lb.classList.add("open");
}
lb.addEventListener("click", () => lb.classList.remove("open"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") lb.classList.remove("open"); });

/* ---------- Início ---------- */
(async function init() {
  if (SUPABASE_URL.startsWith("COLE_AQUI")) {
    $("login").hidden = false;
    $("loginMsg").textContent = "Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html.";
    return;
  }
  await loginPeloQR();
  const { data: { session } } = await sb.auth.getSession();
  if (session) await mostrarAlbum();
  else $("login").hidden = false;
})();
</script>
</body>
</html>
